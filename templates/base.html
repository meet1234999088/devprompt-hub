<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}DevPrompt Hub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('index') }}">DevPrompt Hub</a>
  <a class="button" href="{{ url_for('create') }}">+ New Prompt</a>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>Open-source developer tool · Built for reusable AI prompts</footer>
</body>
</html>
